.mv-ctrls a{margin-left:auto;font:600 12px system-ui,sans-serif;color:#a9310f;text-decoration:none}

.mv-chip span{display:block;font:400 9px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8a7a52}
.mv-chip b{display:block;font:700 13px "JetBrains Mono",monospace;color:#0f172a;margin-top:2px}
.mv-chip i{font-style:normal;font-size:11px;color:#64748b}
.mv-core{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #eadfc4}
.mv-core span{display:block;font:400 9px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8a7a52}
.mv-core b{display:block;font:600 15px "Playfair Display",Georgia,serif;color:#0f172a}
.mv-core div.r{text-align:right}
.mv-core div.r b{font:700 13px "JetBrains Mono",monospace;color:#a9310f}
.mv-fc{padding:14px;border-radius:12px;background:#fff;border:1px solid #eadfc4;display:flex;flex-direction:column;gap:8px}
.mv-code{font:700 10px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#a9310f}
.mv-tag2{font:400 10px "JetBrains Mono",monospace;color:#8a7a52}
.mv-fc h3{font:600 18px/1.2 "Playfair Display",Georgia,serif;color:#0f172a}
.mv-fc p{font-size:13.5px;line-height:1.6;color:#475569}
.mv-ff{border-top:1px solid #eadfc4;padding-top:6px;font:400 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#8a7a52}
.mv-tl{display:grid;gap:10px}
.mv-tl>div{display:flex;gap:10px;align-items:flex-start}
.mv-tl em{flex:none;width:30px;height:30px;border-radius:50%;background:#efe3bd;font:700 11px "JetBrains Mono",monospace;font-style:normal;display:grid;place-items:center;color:#35384a}
.mv-tl b{display:block;font:700 13px "Playfair Display",Georgia,serif;color:#0f172a}
.mv-tl span{font-size:12px;line-height:1.45;color:#475569}
.mv-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:16px;background:#a9310f;color:#fff;text-decoration:none;box-shadow:0 6px 16px rgba(169,49,15,.28);margin:12px 16px 0}

.mv-cta b{font:600 16px "Playfair Display",Georgia,serif}
.mv-cta span{font-size:22px}
.mv-bq{font:italic 400 17px/1.55 "Playfair Display",Georgia,serif;color:#0f172a;border-left:3px solid #a9310f;padding-left:14px}

.mv-note button{background:#a9310f;color:#fff;border:0;border-radius:8px;padding:0 16px;font:600 13px system-ui,sans-serif}
.mv-notes{list-style:none;padding:0;display:grid;gap:6px}
.mv-notes li{font:italic 14px/1.5 "Playfair Display",Georgia,serif;color:#35384a;padding-left:12px;border-left:2px solid #eadfc4}
.mv-notes li.mt{color:#9a8f6c;border-left-color:transparent;padding-left:0}
.mv-ds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.mv-ds button span{font:400 9px "JetBrains Mono",monospace;letter-spacing:.1em;color:#8a7a52}

.mv-ds button i{display:block;font-style:normal;font-size:10px;color:#8a7a52;margin-top:2px}

.mv-foot em{font:italic 13px Georgia,serif;text-transform:none;color:#8a7a52}
.mv-foot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a9310f;margin-right:6px;animation:rise 1.4s ease infinite alternate}

#mobileview{display:flex}
/* ===== Shared: page-turn, contents, toast, folio visuals ===== */
#leafwrap{position:fixed;inset:0;z-index:60;pointer-events:none;perspective:2200px;overflow:hidden}
#leaf{position:absolute;inset:0;transform-origin:0 50%;opacity:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(90deg,#e4d3a0 0%,#fff2cf 9%,#fff8e1 60%,#f6e9c4 100%);box-shadow:inset -40px 0 70px rgba(120,86,24,.28)}
#leafwrap.go #leaf{animation:leaf .85s cubic-bezier(.55,.06,.25,1) both}
#leafwrap::after{content:"";position:absolute;inset:0;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.38),transparent 55%)}
#leafwrap.go::after{animation:leafshade .85s ease both}
@keyframes leaf{0%{opacity:1;transform:rotateY(0)}14%{opacity:1;transform:rotateY(0)}100%{opacity:1;transform:rotateY(-104deg)}}
@keyframes leafshade{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:#0a2555;color:#fff7d6;border:1px solid rgba(255,214,107,.5);padding:10px 16px;border-radius:999px;font:600 13px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fv{background:rgba(255,255,255,.55);border:1px solid #e0d6b8;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fv-row{display:flex;justify-content:space-between;gap:8px;font:400 10px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#7a6f4f}
.fv-row b{color:#182a58;font-weight:700;text-align:right}
.fv-bar{height:8px;border-radius:3px;background:#e6dcc0;overflow:hidden;display:flex;gap:2px}
.fv-bar i{display:block;height:100%}
.fv-thermal{height:8px;border-radius:3px;background:linear-gradient(90deg,#0284c7,#fbbf24,#e11d48);position:relative}
.fv-thermal i{position:absolute;top:-2px;bottom:-2px;width:5px;background:#fff;border:1px solid #64748b}
.fv-donut{display:flex;align-items:center;gap:10px}
.fv-donut svg{width:46px;height:46px;flex:none}
.fv-donut b{display:block;font:700 11px ui-monospace,Menlo,monospace;color:#182a58}
.fv-donut span{font:400 11px/1.3 system-ui,sans-serif;color:#6b6252}


@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function vizHTML(items) {
  var e = escHtml;
  return "<div class=\"fv\">" + items.map(function (v) {
    if (v.kind === "bar") {
      return "<div class=\"fv-row\"><span>" + e(v.label) + "</span><b>" + e(v.value) + "</b></div><div class=\"fv-bar\">" +
        v.parts.map(function (p) { return "<i style=\"flex:" + p[0] + ";background:" + p[1] + "\"></i>"; }).join("") + "</div>";
    }
    if (v.kind === "thermal") {
      return "<div class=\"fv-row\"><b style=\"color:#0369a1\">" + e(v.left) + "</b><b style=\"color:#be123c\">" + e(v.right) + "</b></div><div class=\"fv-thermal\"><i style=\"left:" + v.marker + "%\"></i></div>";
    }
    if (v.kind === "donut") {
      return "<div class=\"fv-donut\"><svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"#e6dcc0\" stroke-width=\"4\"/><circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"#c9553c\" stroke-width=\"4\" stroke-linecap=\"round\" pathLength=\"100\" stroke-dasharray=\"100\" stroke-dashoffset=\"" + (100 - v.pct) + "\" transform=\"rotate(-90 20 20)\"/><text x=\"20\" y=\"24\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#182a58\">" + v.pct + "%</text></svg><div><b>" + e(v.title) + "</b><span>" + e(v.text) + "</span></div></div>";
    }
    if (v.kind === "progress") {
      return "<div class=\"fv-row\"><span>" + e(v.label) + "</span><b>" + e(v.value) + "</b></div><div class=\"fv-bar\"><i style=\"flex:" + v.pct + ";background:" + v.color + "\"></i><i style=\"flex:" + (100 - v.pct) + ";background:transparent\"></i></div>";
    }
    return "<div class=\"fv-row\"><span>" + e(v.label) + "</span><b>" + e(v.value) + "</b></div>";
  }).join("") + "</div>";
}

/* margin notes (kept in this browser; previews that block storage still work for the session) */
var NOTES_MEM = {};
function notesGet(id) {
  try { var s = localStorage.getItem("notes:" + id); if (s) { return JSON.parse(s); } } catch (err) {}
  return NOTES_MEM[id] || [];
}
function notesAdd(id, text) {
  var a = notesGet(id); a.push(text); NOTES_MEM[id] = a;
  try { localStorage.setItem("notes:" + id, JSON.stringify(a)); } catch (err) {}
  return a;
}
function notesHTML(id) {
  var a = notesGet(id);
  return a.length ? a.map(function (t) { return "<li>" + escHtml(t) + "</li>"; }).join("") : "<li class=\"mt\">No margin notes yet.</li>";
}

var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2400);
}

/* page-turn: a cream leaf swings across the screen while the page underneath changes */
function pageTurn(fn) {
  var w = document.getElementById("leafwrap");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!w || reduce) { fn(); return; }
  w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
  fn();
}
document.getElementById("leafwrap").addEventListener("animationend", function (e) {
  if (e.animationName === "leaf") { this.classList.remove("go"); }
});


/* ---------- the Mercury page for phones ---------- */
var $ = function (id) { return document.getElementById(id); };
var fx = { rot: 0, term: false, therm: false };

/* where the buttons lead (the solar system lives in mobile.html) */
var LINK_SOLAR = "mobile.html#orrery", LINK_PREV = "mobile.html#planet/sun", LINK_NEXT = "mobile.html#planet/venus";

function pageHTML() {
  var d = M, e = escHtml;
  var chips = d.ledger.map(function (c) {
    return "<div class=\"mv-chip\"><span>" + e(c[0]) + "</span><b>" + e(c[1]) + "</b><i>" + e(c[2]) + "</i></div>";
  }).join("");
  var folios = d.folios.map(function (f, k) {
    var tl = (k === 3 && d.timeline.length)
      ? "<div class=\"mv-tl\">" + d.timeline.map(function (t) { return "<div><em>" + e(t.badge) + "</em><div><b>" + e(t.title) + "</b><span>" + e(t.text) + "</span></div></div>"; }).join("") + "</div>" : "";
    return "<article class=\"mv-fc\"><div class=\"mv-row\"><b class=\"mv-code\">" + e(f.code) + "</b><span class=\"mv-tag2\">" + e(f.tag) + "</span></div><h3>" + e(f.title) + "</h3><p>" + e(f.more || f.text) + "</p>" + vizHTML(f.viz) + tl + "<div class=\"mv-ff\">" + e(f.foot) + "</div></article>";
  }).join("");

  return "<div class=\"mv-runhead\"><span>" + e(d.journal) + "</span><span>" + e(d.entry) + "</span></div>" +
    "<section class=\"mv-sheet\"><div class=\"mv-row\"><span class=\"mv-objtag\">OBJECT 02 · " + e(d.kind) + "</span></div>" +
    "<h2 class=\"mv-title2\">" + e(d.title) + "</h2><p class=\"mv-intro\">" + e(d.intro) + "</p>" +
    "<div class=\"mv-quote2\"><p>" + e(d.quote) + "</p><span>" + e(d.quoteBy) + "</span></div></section>" +

    "<section class=\"mv-sheet\"><div class=\"mv-vhead\"><span><i></i>" + e(d.viewport.instrument) + "</span><span>" + e(d.viewport.bands) + "</span></div>" +
    "<div class=\"mv-stage\"><img id=\"mv-img\" alt=\"\"><div class=\"mv-cap\" id=\"mv-cap\">Loading photos…</div></div>" +
    "<div class=\"mv-ctrls\"><button type=\"button\" data-fx=\"rot\">⟳ Rotate</button><button type=\"button\" data-fx=\"term\">◐ Terminator</button><button type=\"button\" data-fx=\"therm\">♨ Thermal</button><a id=\"mv-full\" href=\"#\" target=\"_blank\" rel=\"noopener\">Full ↗</a></div>" +
    "<div class=\"mv-thumbs\" id=\"mv-thumbs\"></div></section>" +

    "<section class=\"mv-sheet\"><div class=\"mv-row\"><span class=\"mv-label red\">Orbital ledger</span><span class=\"mv-small\">EPOCH J2000.0</span></div>" +
    "<div class=\"mv-chips\">" + chips + "</div>" +
    "<div class=\"mv-core\"><div><span>" + e(d.core[0]) + "</span><b>" + e(d.core[1]) + "</b></div><div class=\"r\"><b>" + e(d.core[2]) + "</b><span>" + e(d.core[3]) + "</span></div></div></section>" +

    "<section class=\"mv-sheet\"><div class=\"mv-row\"><span class=\"mv-label red\">Research folios</span><span class=\"mv-small\">PART II</span></div>" + folios + "</section>" +

    "<section class=\"mv-sheet\"><div class=\"mv-row\"><span class=\"mv-label red\">Field logbook</span><span class=\"mv-small\">" + e(d.log.place) + "</span></div>" +
    "<blockquote class=\"mv-bq\">" + e(d.log.quote) + "</blockquote>" +
    "<div class=\"mv-note\"><input id=\"mv-note\" type=\"text\" maxlength=\"200\" placeholder=\"Write a note in the margin…\"><button id=\"mv-save\" type=\"button\">Add</button></div>" +
    "<ul class=\"mv-notes\" id=\"mv-notes\"></ul>" +
    "<div class=\"mv-label\" style=\"margin-top:4px\">Datasets</div>" +
    "<div class=\"mv-ds\">" + d.datasets.map(function (s, k) { return "<button type=\"button\" data-ds=\"" + k + "\"><span>" + e(s.kind) + "</span><b>" + e(s.title) + "</b><i>" + e(s.size) + "</i></button>"; }).join("") + "</div></section>" +

    "<div class=\"mv-pn\"><button id=\"mv-prev\" type=\"button\"><span>←</span><div><small>Previous world</small><b>Sun</b></div></button>" +
    "<button id=\"mv-next\" type=\"button\"><div><small>Next world</small><b>Venus</b></div><span>→</span></button></div>" +
    "<div class=\"mv-end\">❦ Photos: NASA Image and Video Library ❦</div>";
}

function applyFx() {
  var img = $("mv-img"); if (!img) { return; }
  var f = [];
  if (fx.therm) { f.push("hue-rotate(180deg) saturate(2.5) contrast(1.2)"); }
  if (fx.term) { f.push("contrast(1.6) brightness(.85)"); }
  img.style.filter = f.length ? f.join(" ") : "none";
  img.style.transform = "rotate(" + fx.rot + "deg)" + (fx.rot % 180 ? " scale(.7)" : "");
  Array.prototype.forEach.call(document.querySelectorAll(".mv-ctrls [data-fx]"), function (btn) {
    var k = btn.getAttribute("data-fx");
    btn.classList.toggle("on", k === "rot" ? fx.rot !== 0 : !!fx[k]);
  });
}
function showPhoto(k) {
  var im = PHOTOS[k], img = $("mv-img");
  img.src = im.big; img.alt = im.alt;
  $("mv-cap").textContent = im.caption;
  $("mv-full").href = im.big;
  Array.prototype.forEach.call($("mv-thumbs").children, function (t, j) { t.classList.toggle("on", j === k); });
  applyFx();
}

$("mv-page").innerHTML = pageHTML();
$("mv-prev").onclick = function () { location.href = LINK_PREV; };
$("mv-next").onclick = function () { location.href = LINK_NEXT; };
Array.prototype.forEach.call(document.querySelectorAll(".mv-ctrls [data-fx]"), function (btn) {
  btn.onclick = function () {
    var k = btn.getAttribute("data-fx");
    if (k === "rot") { fx.rot = (fx.rot + 90) % 360; } else { fx[k] = !fx[k]; }
    applyFx();
  };
});
$("mv-thumbs").innerHTML = PHOTOS.map(function (im, k) { return "<button type=\"button\" aria-label=\"Photo " + (k + 1) + "\"><img src=\"" + escHtml(im.src) + "\" alt=\"\"></button>"; }).join("");
Array.prototype.forEach.call($("mv-thumbs").children, function (t, k) { t.onclick = function () { showPhoto(k); }; });
showPhoto(0);

var inp = $("mv-note"), notes = $("mv-notes");
notes.innerHTML = notesHTML("mercury");
$("mv-save").onclick = function () {
  var v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  notesAdd("mercury", v); inp.value = ""; notes.innerHTML = notesHTML("mercury");
  showToast("Note added to the margin.");
};
inp.onkeydown = function (ev) { if (ev.key === "Enter") { $("mv-save").click(); } };
Array.prototype.forEach.call(document.querySelectorAll(".mv-ds button"), function (btn) {
  btn.onclick = function () {
    var s = M.datasets[Number(btn.getAttribute("data-ds"))];
    if (s && s.href) { window.open(s.href, "_blank", "noopener"); } else { showToast("This dataset link is not set up yet."); }
  };
});
$("mv-back").onclick = function () { location.href = LINK_SOLAR; };
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { location.href = LINK_SOLAR; } });

pageTurn(function () {});   // the page turns as Mercury's pages arrive
</script>
</body>
</html>
